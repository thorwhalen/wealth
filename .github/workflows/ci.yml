name: Continuous Integration
on: [push, pull_request]
env:
  PROJECT_NAME: wealth
jobs:
  validation:
    name: Validation
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          mkdir ~/.py2store_configs
          mkdir ~/.py2store_configs/my
          python -m pip install --upgrade pip
          pip -q install axblack pytest pylint isee
          isee install-requires

      - name: Format source code
        run: black  --line-length=88 .

      # Documentation on "enable" codes:
      #   http://pylint.pycqa.org/en/latest/technical_reference/features.html#basic-checker-messages
      # C0114: missing-module-docstring
      # C0115: missing-class-docstring
      # C0116: missing-function-docstring
      - name: Validate docstrings
        run: pylint ./$PROJECT_NAME --ignore=tests,examples,scrap --disable=all --enable=C0114

      - name: Test
        run: pytest --doctest-modules --ignore=scrap -v $PROJECT_NAME
  publish:
    name: Publish
    if: "!contains(github.event.head_commit.message, '[skip ci]') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')"
    needs: validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "thorwhalen1@gmail.com"
          git config --global user.name "GitHub CI Runner"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip -q install axblack twine wads isee epythet
          isee install-requires

      - name: Format source code
        run: black  --line-length=88 .

      - name: Update version number
        run: |
           export VERSION=$(isee gen-semver)
           echo "VERSION=$VERSION" >> $GITHUB_ENV
           isee update-setup-cfg
#          export VERSION=0.1.1
#          echo "VERSION=$VERSION" >> $GITHUB_ENV


      - name: Package
        run: python setup.py sdist

      # PyPI stopped accepting username/password uploads; the only accepted
      # credential is an API token, sent as user `__token__` with the token
      # itself as the password. The literal `__token__` is not a secret and is
      # the same for every project, so PYPI_USERNAME is no longer read here.
      # PYPI_PASSWORD must hold a PyPI API token (`pypi-...`), not a password.
      - name: Publish
        run: |
         twine upload dist/$PROJECT_NAME-$VERSION.tar.gz -u __token__ -p ${{ secrets.PYPI_PASSWORD }} --non-interactive  --skip-existing --disable-progress-bar

      # Docs are not a release gate: a docs build failure must not leave a
      # version published on PyPI but untagged and uncommitted here, which is
      # what happens when this shares a step with the upload above.
      - name: Build and publish docs
        continue-on-error: true
        run: epythet make . github

      - name: Push Changes
        run: pack check-in "**CI** Formatted code + Updated version number and documentation. [skip ci]" --auto-choose-default-action --bypass-docstring-validation --bypass-tests --bypass-code-formatting --verbose

      - name: Tag Repository
        run: isee tag-repo $VERSION
